<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Book cover -->
  <rect x="12" y="8" width="40" height="48" rx="2" fill="#4299E1" stroke="#2B6CB0" stroke-width="2"/>
  
  <!-- Book pages -->
  <rect x="14" y="10" width="36" height="44" fill="#E2E8F0"/>
  
  <!-- Page lines -->
  <line x1="18" y1="18" x2="46" y2="18" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="18" y1="24" x2="46" y2="24" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="18" y1="30" x2="46" y2="30" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="18" y1="36" x2="40" y2="36" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="18" y1="42" x2="46" y2="42" stroke="#CBD5E0" stroke-width="1.5"/>
  <line x1="18" y1="48" x2="38" y2="48" stroke="#CBD5E0" stroke-width="1.5"/>
  
  <!-- Book spine highlight -->
  <rect x="12" y="8" width="4" height="48" fill="#2B6CB0" opacity="0.6"/>
  
  <!-- Bookmark -->
  <path d="M 28 8 L 28 20 L 32 16 L 36 20 L 36 8 Z" fill="#F56565"/>
</svg>
